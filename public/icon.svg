<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Card Graphic -->
  <g filter="url(#shadow)">
    <!-- Base Wallet / Card -->
    <rect x="96" y="140" width="320" height="232" rx="28" fill="#ffffff" />
    <rect x="96" y="190" width="320" height="48" fill="#0f172a" />
    
    <!-- Chip / Security emblem -->
    <rect x="136" y="260" width="52" height="40" rx="8" fill="url(#goldGrad)" />
    
    <!-- Decorative Card Lines -->
    <rect x="210" y="268" width="120" height="10" rx="5" fill="#e2e8f0" />
    <rect x="210" y="288" width="80" height="10" rx="5" fill="#e2e8f0" />
    
    <!-- Currency / microMoney Emblem (MT / Coin) -->
    <circle cx="345" cy="285" r="32" fill="url(#goldGrad)" />
    <text x="345" y="295" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>
  </g>
</svg>
